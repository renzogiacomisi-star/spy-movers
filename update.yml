name: Guardar cierre SPY

# Guarda una foto del día al cierre en site/data/history/ para poder ver días anteriores.
# Los datos en vivo los calcula la app de Streamlit; este workflow corre una sola vez por día.
on:
  schedule:
    # 21:20 UTC = 16:20 Nueva York en horario de invierno (17:20 en horario de verano).
    - cron: "20 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spy-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas numpy requests openpyxl lxml yfinance

      - name: Calcular contribución y amplitud
        run: python scripts/build_data.py

      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos SPY $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
