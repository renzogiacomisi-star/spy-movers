name: Actualizar datos SPY

on:
  schedule:
    # Horarios en UTC, lunes a viernes. Con horario de invierno de EE.UU. (UTC-5):
    # 15:00 = 10:00 NY | 17:30 = 12:30 NY | 19:30 = 14:30 NY | 21:20 = 16:20 NY (cierre)
    - cron: "0 15 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spy-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Calcular contribución y amplitud
        run: python scripts/build_data.py

      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos SPY $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
