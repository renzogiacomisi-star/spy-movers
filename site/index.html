<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qué movió al S&amp;P 500</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E9EDF1;
  --panel: #F7F9FB;
  --ink: #18222D;
  --muted: #5B6878;
  --line: #CBD3DC;
  --up: #1D7A5B;
  --up-soft: #CFE6DC;
  --down: #B3374A;
  --down-soft: #F0D3D8;
  --accent: #2F5577;
  --spy: #2457A6;
  --ew: #C07A12;
  --c3: #7B4FB0;
  --c4: #12809C;
  --heat-dn: #2E6FC4;
  --on-color: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161E;
    --panel: #16202A;
    --ink: #E3E9EF;
    --muted: #8D9AA9;
    --line: #2A3845;
    --up: #4DB38C;
    --up-soft: #1B3A30;
    --down: #E26A7C;
    --down-soft: #45232A;
    --accent: #8FB4D8;
    --spy: #7FB0FF;
    --ew: #F2B44D;
    --c3: #B99CF2;
    --c4: #5CC6E0;
    --heat-dn: #4F8FE0;
    --on-color: #0F161E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161E; --panel: #16202A; --ink: #E3E9EF; --muted: #8D9AA9; --line: #2A3845;
  --up: #4DB38C; --up-soft: #1B3A30; --down: #E26A7C; --down-soft: #45232A; --accent: #8FB4D8; --spy: #7FB0FF; --ew: #F2B44D; --c3: #B99CF2; --c4: #5CC6E0; --heat-dn: #4F8FE0; --on-color: #0F161E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 24px 20px 64px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
.layout.has-side { grid-template-columns: minmax(0, 1fr) 320px; grid-template-areas: "ext ext" "hero side" "rest side"; }
.layout.has-side > .extbox { grid-area: ext; }
.layout.has-side > .hero { grid-area: hero; }
.layout.has-side > .side { grid-area: side; align-self: start; }
.layout.has-side > .rest { grid-area: rest; min-width: 0; }
@media (max-width: 1100px) {
  .layout.has-side { grid-template-columns: minmax(0, 1fr); grid-template-areas: "ext" "hero" "side" "rest"; }
  .layout.has-side > .side { margin-bottom: 20px; }
}

/* Horario del mercado */
.clock { background: var(--panel); border-radius: 8px; padding: 12px 16px; margin: -12px 0 24px; }
.clock-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; font-size: 14px; }
.clock-state { font-weight: 700; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.hbar { position: relative; height: 26px; margin: 10px 0 4px; display: flex; border-radius: 4px; overflow: hidden; }
.hbar > div { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.hbar .seg-pre, .hbar .seg-post { background: color-mix(in srgb, var(--spy) 22%, var(--bg)); color: var(--ink); }
.hbar .seg-reg { background: var(--spy); color: var(--on-color); }
.hbar .seg-off { background: var(--bg); }
.hnow { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
.hticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.hticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip.warn { background: color-mix(in srgb, var(--ew) 20%, var(--bg)); }

/* Pre-market / after-hours */
.extbox { background: var(--panel); border-radius: 8px; padding: 18px 20px; margin-bottom: 24px; border-left: 4px solid var(--spy); }
.extbox h2 { margin-bottom: 4px; }
.ext-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 28px; margin-top: 12px; }
@media (max-width: 900px) { .ext-grid { grid-template-columns: 1fr; } }
.ext-grid table td, .ext-grid table th { padding: 4px 6px; font-size: 13.5px; }

/* Columna lateral */
.side .panel { padding: 16px; margin-bottom: 16px; }
.side h2 { font-size: 17px; }
.fw-row { margin: 10px 0; }
.fw-row .fw-lab { display: flex; justify-content: space-between; font-size: 13.5px; gap: 8px; }
.fw-bar { height: 10px; border-radius: 3px; background: var(--bg); margin-top: 4px; overflow: hidden; }
.fw-bar > div { height: 100%; background: var(--spy); }
.ev-day { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.ev .h { color: var(--muted); font-size: 12px; line-height: 1.35; }
.ev .n { font-weight: 600; }
.ev .l { grid-column: 2; font-size: 12px; color: var(--muted); }
.ev.imp3 .n::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--down); margin-right: 6px; vertical-align: 1px; }
.ev.mkt .n { color: var(--ew); }
h1, h2, h3 { margin: 0; font-stretch: 75%; letter-spacing: 0; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
p { margin: 0; }
.muted { color: var(--muted); }
.up { color: var(--up); }
.down { color: var(--down); }

/* Encabezado */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
.top-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
select, input[type="search"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
}
select:focus-visible, input:focus-visible, button:focus-visible, .seg:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.refresh { font: inherit; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.refresh:hover { border-color: var(--accent); }
.refresh.back { background: var(--spy); color: var(--on-color); border-color: var(--spy); }
.stale-note { color: var(--down); font-weight: 700; }

/* Hero */
.brand { font-weight: 700; font-stretch: 75%; font-size: 17px; }
.hero { margin-bottom: 36px; }
.headline {
  font-size: clamp(40px, 7.4vw, 92px); font-weight: 800; font-stretch: 68%;
  line-height: .95; letter-spacing: -0.01em; max-width: 14ch; margin: 0;
}
.stamp { margin-top: 14px; font-size: 14px; color: var(--muted); }
.rule { height: 4px; background: var(--ink); margin: 18px 0 24px; border: 0; }
.lead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: start; }
.lead-text { max-width: 68ch; display: grid; gap: 14px; font-size: 17px; line-height: 1.6; }
.lead-text .p1 { font-size: 19px; }
.lead-text .p2 { display: grid; gap: 8px; }
.figures { display: grid; gap: 18px; justify-items: end; text-align: right; }
.big { font-stretch: 62%; font-weight: 800; font-size: clamp(48px, 7vw, 84px); line-height: .9; }
.big small { display: block; font-size: 14px; font-weight: 500; font-stretch: 100%; color: var(--muted); margin-top: 6px; line-height: 1.3; }
@media (max-width: 760px) {
  .lead { grid-template-columns: 1fr; }
  .figures { grid-template-columns: 1fr 1fr; justify-items: start; text-align: left; order: -1; }
}

/* Ayuda "?" */
.h-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.h-row h2 { margin: 0; }
.help {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--muted); background: transparent; color: var(--muted);
  font: 700 13px/1 "Archivo", Arial, sans-serif; cursor: pointer; padding: 0;
}
.help[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.help-box {
  margin: 10px 0 14px; padding: 14px 16px; border-left: 3px solid var(--accent);
  background: var(--bg); border-radius: 0 6px 6px 0; font-size: 14px; max-width: 78ch; display: grid; gap: 8px;
}
.help-box[hidden] { display: none; }

/* Campana */
.swarm-box { position: relative; width: 100%; }
.swarm-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.swarm-box circle { cursor: default; }
.swarm-box circle:hover, .swarm-box circle:focus { stroke: var(--ink); stroke-width: 1.5; outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend .k-spy { color: var(--spy); font-weight: 700; }
.legend .k-ew { color: var(--ew); font-weight: 700; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.tug-wrap { position: relative; }
.tug-sides { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.tug {
  position: relative; display: flex; height: 64px; background: var(--panel);
  border-radius: 4px; overflow: hidden;
}
.seg {
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; font-stretch: 75%; color: var(--on-color);
  border-right: 1px solid var(--panel); overflow: hidden; white-space: nowrap; cursor: default;
}
.seg.pos { background: var(--up); }
.seg.neg { background: var(--down); }
.seg.rest { opacity: .55; }
.zero { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
.net { position: relative; height: 34px; margin-top: 4px; }
.net-mark { position: absolute; top: 0; transform: translateX(-50%); text-align: center; font-size: 13px; font-weight: 700; white-space: nowrap; }
.net-mark::before { content: ""; display: block; width: 0; height: 0; margin: 0 auto 2px;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--ink); }
.tug-caption { min-height: 22px; font-size: 14px; margin-top: 2px; }
.summary { margin-top: 18px; max-width: 72ch; display: grid; gap: 4px; font-size: 16px; }

/* Grilla */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
.panel { background: var(--panel); border-radius: 8px; padding: 20px; min-width: 0; }
.span-12 { grid-column: span 12; }
.span-7 { grid-column: span 7; }
.span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; }
@media (max-width: 900px) { .span-7, .span-5, .span-6 { grid-column: span 12; } }
.panel-note { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

/* Contribuyentes */
.movers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; }
@media (max-width: 600px) { .movers { grid-template-columns: 1fr; } }
.movers h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 66px; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row .tk { font-weight: 700; }
.row .nm { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { text-align: right; font-weight: 700; }
.minibar { height: 4px; border-radius: 2px; margin-top: 3px; }

/* Sectores */
.sec { display: grid; grid-template-columns: 150px 1fr 66px; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sec .meta { font-size: 12px; color: var(--muted); }
.div-bar { position: relative; height: 14px; }
.div-bar .axis { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.div-bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
@media (max-width: 600px) { .sec { grid-template-columns: 110px 1fr 58px; } }

.heat { font-weight: 600; }
.badge { font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; vertical-align: 1px; }
.heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; margin-top: 8px; }
.heat-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
.src-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; max-width: 100ch; }

/* Amplitud */
.split { display: flex; height: 26px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.split div { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 700; color: var(--on-color); white-space: nowrap; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-top: 18px; }
.stat b { display: block; font-size: 26px; font-stretch: 70%; font-weight: 800; line-height: 1.1; }
.stat > span { font-size: 13px; color: var(--muted); }
.spark { width: 100%; height: 70px; display: block; margin-top: 6px; }

/* Concentración */
.conc-bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin: 10px 0 6px; background: var(--bg); }

/* Tablas */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
th button[aria-sort="descending"]::after { content: " ▾"; }
th button[aria-sort="ascending"]::after { content: " ▴"; }
.scroll { overflow-x: auto; }
.table-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tbl-wrap { overflow-x: auto; }
.tbl-wrap > div { min-width: 760px; }
.tbl-body { max-height: 520px; overflow-y: auto; scrollbar-gutter: stable; }
.tbl-foot { overflow-y: hidden; scrollbar-gutter: stable; border-top: 2px solid var(--ink); }
.tbl-foot td { font-weight: 700; border-top: 0; }
table.fixed { table-layout: fixed; }
table.fixed td, table.fixed th { overflow: hidden; text-overflow: ellipsis; }
table.fixed thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
td .nm { color: var(--muted); max-width: 210px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }

.src-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; max-width: 100ch; }

/* Amplitud */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 24px; margin-top: 16px; }
@media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } }
.bgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 12px; }
@media (max-width: 1000px) { .bgrid { grid-template-columns: 1fr; } }
.bcard { background: var(--bg); border-radius: 8px; padding: 14px; min-width: 0; }
.bt { font-size: 14px; margin: 0; }
.small { font-size: 12px; }
.bread { margin-top: 20px; border-left: 4px solid var(--accent); padding: 4px 0 4px 16px; }
.bread h3 { font-size: 17px; margin: 0 0 6px; }
.bread > p { max-width: 80ch; }
.bitems { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 20px; margin-top: 12px; }
@media (max-width: 900px) { .bitems { grid-template-columns: 1fr 1fr; } }
@media (max-width: 500px) { .bitems { grid-template-columns: 1fr; } }

/* Mapa de calor */
.heatmap { position: relative; width: 100%; height: 620px; background: #1B1E26; border-radius: 6px; overflow: hidden; margin-top: 10px; }
@media (max-width: 700px) { .heatmap { height: 520px; } }
.hm-sec { position: absolute; box-sizing: border-box; border: 1px solid #1B1E26; }
.hm-sec-name { position: absolute; left: 0; right: 0; top: 0; height: 16px; padding: 0 5px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .02em; color: #C9CED8; background: #262A34; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 16px; }
.hm-cell { position: absolute; box-sizing: border-box; border: 1px solid #1B1E26; color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; overflow: hidden; cursor: default; line-height: 1.1; }
.hm-cell:hover, .hm-cell:focus { outline: 2px solid #fff; outline-offset: -2px; z-index: 2; }
.hm-cell b { font-weight: 800; }
.hm-cell span { opacity: .92; }
.heat-legend-bar { display: flex; border-radius: 4px; overflow: hidden; font-size: 11px; font-weight: 700; color: #fff; }
.heat-legend-bar span { padding: 3px 7px; }

/* Clima del día */
.rg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 6px 0 4px; }
.rg-sesgo { font-size: 24px; font-weight: 800; font-stretch: 75%; }
.rg-esc { display: inline-block; font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; }
.rg-esc.ftq { background: var(--down-soft); color: var(--down); }
.rg-esc.ron { background: var(--up-soft); color: var(--up); }
.rg-esc.tasas { background: var(--down-soft); color: var(--down); }
.rg-esc.none { background: var(--bg); color: var(--muted); }
.rg-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 40px; margin-top: 16px; }
@media (max-width: 760px) { .rg-grid { grid-template-columns: 1fr; } }
.rg-col h3 { font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 6px; background: var(--bg); }
.sig { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sig .ok { font-weight: 800; text-align: center; }
.sig .th { font-size: 12px; color: var(--muted); }
.sig .v { font-weight: 700; text-align: right; }

/* Temáticas */
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.trow .tn { font-weight: 700; font-size: 14px; }
.trow .tn small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
.trow .tm { font-size: 12px; color: var(--muted); margin-top: 1px; }
.trow .val { text-align: right; font-weight: 700; }
details.all-th { margin-top: 18px; }
details.all-th summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--accent); }
details.all-th table td.mem { white-space: normal; text-align: left; color: var(--muted); font-size: 12px; min-width: 220px; }

/* Tabla con solapas */
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; max-width: 100%; overflow-x: auto; }
.tabs button {
  font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 0;
  padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.tbl-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
tfoot td { font-weight: 700; border-top: 2px solid var(--ink); background: var(--panel); position: sticky; bottom: 0; }
.explain { background: var(--bg); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 28px; align-items: center; }
.ex2 { display: flex; gap: 28px; }
.ex2 > div { display: grid; }
.ex2 span { font-size: 13px; color: var(--ink); }
.ex2 small { font-size: 12px; color: var(--muted); }
@media (max-width: 700px) { .explain { grid-template-columns: 1fr; } }
.explain b { display: block; font-size: 38px; font-stretch: 65%; font-weight: 800; line-height: 1; }
.explain p { font-size: 13px; color: var(--muted); }
.explain .big-l { font-size: 14px; color: var(--ink); }

footer { margin-top: 32px; font-size: 13px; color: var(--muted); max-width: 80ch; display: grid; gap: 6px; }
.empty { padding: 40px 20px; background: var(--panel); border-radius: 8px; max-width: 60ch; }
.empty h2 { margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .tug .seg { animation: grow .5s ease-out both; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Qué movió al S&amp;P 500</span>
    <div class="top-right">
      <label for="date" class="muted">Día</label>
      <select id="date" aria-label="Elegir día"></select>
      <span id="updated" class="muted"></span>
      <button id="refresh" type="button" class="refresh" hidden>Actualizar ahora</button>
      <button id="back" type="button" class="refresh back" hidden>Volver a hoy</button>
      <button id="pdf" type="button" class="refresh" hidden>Descargar PDF</button>
    </div>
  </header>
  <div id="clock"></div>

  <main id="app">
    <p class="muted">Cargando datos…</p>
  </main>

  <footer id="foot"></footer>
</div>

<script>
const LOC = "es-UY";
const nf = (d, sign = true) => new Intl.NumberFormat(LOC, {
  minimumFractionDigits: d, maximumFractionDigits: d, signDisplay: sign ? "exceptZero" : "auto"
});
const fmt = (x, d = 2, sign = true) => x == null || Number.isNaN(x) ? "s/d" : nf(d, sign).format(x);
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function init() {
  const sel = document.getElementById("date");
  // Modo Streamlit: los datos vienen incrustados en la página
  if (window.__SPY__) {
    const d0 = window.__SPY__;
    const liveDate = window.__SPY_LIVE_DATE__ || null;
    const isLive = window.__SPY_VIEW__ === "live";
    const liveLabel = "Hoy (en vivo)";
    const past = (window.__SPY_DATES__ || []).filter(x => !isLive || x !== liveDate);
    sel.innerHTML = `<option value="live">${liveLabel}</option>` +
      past.map(x => `<option value="${x}">${fechaCorta(x)}</option>`).join("");
    sel.value = isLive ? "live" : d0.date;
    sel.addEventListener("change", () => goTo(sel.value));
    const back = document.getElementById("back");
    if (back && !isLive) { back.hidden = false; back.onclick = () => goTo("live"); }
    render(d0);
    fitFrame();
    return;
  }
  let dates = [];
  try { dates = await getJSON("data/dates.json"); } catch (e) { /* sin historial */ }
  sel.innerHTML = dates.map(d => `<option value="${d}">${fechaCorta(d)}</option>`).join("");
  sel.addEventListener("change", () => load(`data/history/${sel.value}.json`));
  load("data/latest.json");
}

function goTo(day, extra) {
  try {
    const P = window.parent;
    const u = new URL(P.location.href);
    u.searchParams.delete("r");
    if (day === "live") u.searchParams.delete("d"); else u.searchParams.set("d", day);
    Object.entries(extra || {}).forEach(([k, v]) => u.searchParams.set(k, v));
    // La navegación se ejecuta desde la página principal (Streamlit no deja navegar desde el recuadro)
    new P.Function("u", "window.location.assign(u)")(u.toString());
  } catch (e) {
    window.open(day === "live" ? "?" : `?d=${day}`, "_blank");
  }
}

// Ajusta el alto del recuadro de Streamlit al contenido, para que no haya doble scroll
function fitFrame() {
  let fe = null;
  try { fe = window.frameElement; } catch (e) { return; }
  if (!fe) return;
  const wrap = document.querySelector(".wrap");
  const set = () => {
    const h = Math.ceil(wrap.getBoundingClientRect().bottom + window.scrollY + 8);
    if (Math.abs(fe.offsetHeight - h) > 2) { fe.style.height = h + "px"; fe.height = h; }
  };
  set();
  new ResizeObserver(set).observe(wrap);
  keepScroll(fe);
}

// Al actualizarse los datos, vuelve a la misma altura de la página donde estaba la persona
function keepScroll(fe) {
  let host = null;
  try {
    const W = window.parent;
    let e = fe;
    while (e && e.parentElement) {
      e = e.parentElement;
      const cs = W.getComputedStyle(e);
      if (/(auto|scroll)/.test(cs.overflowY) && e.scrollHeight > e.clientHeight) { host = e; break; }
    }
    host = host || W.document.scrollingElement;
  } catch (e) { return; }
  if (!host) return;
  const key = window.__SPY_VIEW__ || "static";
  const saved = loadState().scroll;
  if (saved && saved.key === key && saved.y > 0) {
    host.scrollTop = saved.y;
    setTimeout(() => { host.scrollTop = saved.y; }, 150);
  }
  host.addEventListener("scroll", debounce(() => saveState({ scroll: { key, y: host.scrollTop } }), 200));
}

async function load(url) {
  try {
    const d = await getJSON(url);
    document.getElementById("date").value = d.date;
    render(d);
  } catch (e) {
    app.innerHTML = `<div class="empty">
      <h2>Todavía no hay datos</h2>
      <p>No se pudieron cargar los datos. Volvé a intentar en unos minutos.</p>
    </div>`;
    document.getElementById("foot").innerHTML = "";
  }
}

function fechaCorta(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LOC, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function fechaLarga(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LOC, { weekday: "long", day: "numeric", month: "long" }).replace(",", "");
}

function render(d) {
  const gen = new Date(d.generated_at);
  document.getElementById("updated").textContent =
    "Actualizado " + gen.toLocaleString(LOC, { timeZone: "America/Montevideo", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " (Montevideo)"
    + (d.session === "open" && window.__SPY_NEXT__ && window.__SPY_VIEW__ === "live"
      ? `. Próxima actualización ${new Date(window.__SPY_NEXT__ * 1000).toLocaleTimeString(LOC, { timeZone: "America/Montevideo", hour: "2-digit", minute: "2-digit" })}.` : "");
  if (window.__SPY_STALE__ && window.__SPY_VIEW__ === "live") {
    document.getElementById("updated").innerHTML = `<span class="stale-note">La actualización está demorada.</span> ` +
      esc(document.getElementById("updated").textContent).replace(/\. Próxima actualización.*$/, ".");
  }
  const rb = document.getElementById("refresh");
  if (rb) {
    rb.hidden = !(window.__SPY__ && window.__SPY_VIEW__ === "live" && d.session === "open");
    rb.onclick = () => { rb.disabled = true; rb.textContent = "Actualizando datos…"; goTo("live", { r: Date.now() }); };
  }

  const usePts = d.components.some(c => c.p != null);
  const val = c => usePts ? c.p : c.c;
  const unit = usePts ? "pts" : "pp";

  const nyToday = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const live = d.session === "open";
  const up = (d.spy_ret ?? 0) >= 0;
  const title = live
    ? `¿Por qué ${up ? "sube" : "baja"} el mercado hoy?`
    : d.date === nyToday
      ? `¿Por qué ${up ? "subió" : "bajó"} el mercado hoy?`
      : `¿Por qué ${up ? "subió" : "bajó"} el mercado el ${fechaLarga(d.date)}?`;
  const hora = gen.toLocaleTimeString(LOC, { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit" });
  const stamp = live
    ? `Precios actualizados a las ${hora} de Nueva York, ${fechaLarga(d.date)}. Mercado abierto, con demora de hasta 15 minutos.`
    : `Datos al cierre del ${fechaLarga(d.date)}.`;
  document.title = title + " | Qué movió al S&P 500";

  const side = sidePanel(d);
  app.innerHTML = `<div class="layout${side ? " has-side" : ""}">
    ${extPanel()}
    <section class="hero" aria-label="Resumen del día">
      <h1 class="headline">${esc(title)}</h1>
      <p class="stamp">${esc(stamp)}</p>
      <hr class="rule">
      <div class="lead">
        <div class="lead-text">
          <p class="p1">${esc(d.summary[0] ?? "")}</p>
          <div class="p2">${d.summary.slice(1).map(s => `<p>${esc(s)}</p>`).join("")}</div>
        </div>
        <div class="figures">
          <div class="big ${cls(d.spx_ret ?? d.spy_ret)}">${fmt(d.spx_ret ?? d.spy_ret, 2)}%<small>S&amp;P 500${d.spx_ret != null ? ` (SPY ${fmt(d.spy_ret, 2)}%)` : ""}</small></div>
          <div class="big ${cls(d.spx_pts)}">${fmt(d.spx_pts, 1)}<small>Puntos, en ${fmt(d.spx_last, 2, false)}</small></div>
        </div>
      </div>
    </section>
    ${side ? `<aside class="side" aria-label="Fed y calendario">${side}</aside>` : ""}
    <div class="rest">
    <div class="grid" style="margin-bottom:20px">
      <section class="panel span-12" aria-labelledby="h-tug">
        <div class="h-row">
          <h2 id="h-tug">Quién empujó y quién frenó al índice</h2>
          ${helpBtn("help-tug", "Cómo leer la barra")}
        </div>
        <div id="help-tug" class="help-box" hidden>
          <p>Cada bloque es una acción. Su ancho es cuántos puntos del S&amp;P 500 aportó hoy, que es su peso en el índice multiplicado por su variación del día. Una acción grande que se mueve poco puede pesar más que una chica que se mueve mucho.</p>
          <p>A la derecha de la línea del cero están las que sumaron y a la izquierda las que restaron, ordenadas de mayor a menor desde el cero hacia afuera. Las más chicas se agrupan en "Otras".</p>
          <p>El largo total de la barra no es el movimiento del índice: es todo lo que empujó para arriba más todo lo que empujó para abajo. El movimiento del índice es la diferencia entre los dos lados, y lo marca el triángulo "Neto". Si un lado es mucho más largo, el día fue direccional; si los dos lados son parecidos, hubo mucha pelea interna y poco movimiento neto.</p>
          <p>Pasá el cursor o tocá un bloque para ver el detalle.</p>
        </div>
        ${tugBar(d.components, val, unit, d.model_pts ?? d.model_ret)}
      </section>

      <section class="panel span-12" aria-labelledby="h-swarm">
        <div class="h-row">
          <h2 id="h-swarm">Cómo se movió cada acción</h2>
          ${helpBtn("help-swarm", "Cómo leer la campana")}
        </div>
        <div id="help-swarm" class="help-box" hidden>
          <p>Cada círculo es una acción del S&amp;P 500. La posición horizontal es cuánto varió hoy y el tamaño es su peso en el índice. Las acciones se apilan donde hay muchas con variaciones parecidas, por eso el conjunto toma forma de campana.</p>
          <p>Hay tres líneas verticales. La <strong style="color:var(--spy)">azul</strong> es la variación del SPY, que pondera cada acción por su tamaño. La <strong style="color:var(--ew)">naranja punteada</strong> es la variación equiponderada: el promedio simple de las ~500 acciones, como si todas pesaran lo mismo. Es la misma idea que el RSP (S&amp;P 500 equal weight). La gris es el 0%.</p>
          <p>La equiponderada no da exactamente igual al RSP: el RSP rebalancea a pesos iguales cada tres meses, y entre rebalanceos sus pesos se van corriendo con los precios. Por eso pueden diferir unas décimas; el valor del RSP está en el panel de Amplitud.</p>
          <p>Cómo interpretarlo: si la campana está corrida hacia un lado, el movimiento fue generalizado. Si la campana está centrada pero los círculos grandes están en un extremo, el índice se mueve por unas pocas empresas grandes y la línea azul se separa de la naranja. Cuanto más ancha la campana, más dispersión hubo entre acciones.</p>
          <p>Las variaciones extremas se muestran pegadas al borde del gráfico; el detalle real aparece al pasar el cursor.</p>
        </div>
        <div id="swarm" class="swarm-box"></div>
        <div class="legend">
          <span class="k-spy"><i style="border-color:var(--spy);border-top-width:3px"></i>SPY, ponderado por tamaño ${fmt(d.spy_ret, 2)}%</span>
          <span class="k-ew"><i style="border-color:var(--ew);border-top-style:dashed"></i>Equiponderado, como el RSP ${fmt(d.breadth.equal_weight_ret, 2)}%</span>
          <span><i style="border-color:var(--muted)"></i>0%</span>
        </div>
        <p class="tug-caption muted" id="swarmcap" aria-live="polite">Pasá el cursor o tocá un círculo para ver el detalle.</p>
      </section>
    </div>

    <div class="grid">
      <section class="panel span-12" aria-labelledby="h-movers">
        <h2 id="h-movers">Acciones que más movieron el índice</h2>
        <p class="panel-note">Ordenadas por puntos aportados al S&amp;P 500, no por variación porcentual.</p>
        ${movers(d.components, val, unit)}
      </section>

      <section class="panel span-12" aria-labelledby="h-sec">
        <h2 id="h-sec">Aporte por sector</h2>
        <p class="panel-note">Puntos aportados, variación ponderada del sector y cuántas acciones subieron.</p>
        ${sectors(d.sectors, unit, usePts)}
      </section>

      ${d.regime ? regimePanel(d.regime, d.session) : ""}

      ${d.themes && d.themes.length ? `
      <section class="panel span-12" aria-labelledby="h-th">
        <div class="h-row">
          <h2 id="h-th">Aporte por temática</h2>
          ${helpBtn("help-th", "Cómo se arman las temáticas")}
        </div>
        <div id="help-th" class="help-box" hidden>
          <p>Las temáticas son una clasificación propia, armada sobre las empresas del S&amp;P 500. La mayoría se arma con la sub-industria GICS (por ejemplo, todos los "Regional Banks" van a Bancos regionales), así que una empresa nueva en el índice cae sola en su temática. Las que cruzan industrias, como Chips de IA, Hyperscalers o Centros de datos, usan una lista de tickers revisada a mano.</p>
          <p>Una acción puede estar en varias temáticas: NVDA está en Chips de IA y en Semiconductores (total). Por eso, a diferencia de los sectores, los puntos de las temáticas no suman el movimiento del índice.</p>
          <p>Solo cuentan las empresas del S&amp;P 500, porque lo que se mide es su aporte al índice. Se muestran las temáticas con al menos 3 empresas. Las marcadas como "total" engloban a otras y no se usan en el resumen.</p>
          <p>Última revisión de la clasificación: ${esc(d.themes_info?.revisado ?? "s/d")}.</p>
        </div>
        <p class="panel-note">Las temáticas cubren el ${fmt(d.themes_info?.cobertura, 0, false)}% del peso del índice.${d.themes_info?.no_en_indice?.length ? ` Tickers de la lista que ya no están en el índice: ${d.themes_info.no_en_indice.map(esc).join(", ")}.` : ""}</p>
        ${themesPanel(d.themes, usePts)}
      </section>` : ""}

      <section class="panel span-12" aria-labelledby="h-breadth">
        <h2 id="h-breadth">Amplitud</h2>
        ${breadth(d)}
      </section>

      <section class="panel span-12" aria-labelledby="h-heat">
        <div class="h-row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div class="h-row" style="margin:0">
            <h2 id="h-heat">Mapa del S&amp;P 500</h2>
            ${helpBtn("help-heat", "Cómo leer el mapa")}
          </div>
          <div class="heat-legend-bar" aria-hidden="true">${[-3, -2, -1, 0, 1, 2, 3].map(v => `<span style="background:${heatColor(v)}">${v > 0 ? "+" : ""}${v}%</span>`).join("")}</div>
        </div>
        <div id="help-heat" class="help-box" hidden>
          <p>Cada rectángulo es una acción del índice, agrupada por sector. El tamaño es su peso en el S&amp;P 500 y el color, su variación del día: verde si sube, rojo si baja, más intenso cuanto mayor el movimiento (la escala satura en ±3%).</p>
          <p>Sirve para ver de un vistazo si el día fue generalizado (todo del mismo color) o si lo movieron pocas empresas grandes. Pasá el cursor o tocá una acción para ver el detalle.</p>
        </div>
        <div id="heatmap" class="heatmap" role="img" aria-label="Mapa del S&amp;P 500 por sector, tamaño según peso y color según variación del día"></div>
        <p class="tug-caption muted" id="heatcap" aria-live="polite">Pasá el cursor o tocá una acción para ver el detalle.</p>
      </section>

      <section class="panel span-6" aria-labelledby="h-conc">
        <h2 id="h-conc">Concentración</h2>
        ${concentration(d, usePts)}
      </section>

      <section class="panel span-6" aria-labelledby="h-ctx">
        <h2 id="h-ctx">Contexto</h2>
        ${contextTable(d.context)}
      </section>

      <section class="panel span-12" aria-labelledby="h-all">
        <div class="table-tools">
          <h2 id="h-all">Composición del S&amp;P 500</h2>
          <div class="tabs" role="tablist" aria-label="Cantidad de acciones">
            ${[["10", "Top 10"], ["15", "Top 15"], ["20", "Top 20"], ["all", "Índice total"]].map(([k, l]) =>
              `<button role="tab" type="button" data-n="${k}" aria-selected="false">${l}</button>`).join("")}
          </div>
        </div>
        <p class="panel-note" id="tab-note"></p>
        <div class="tbl-layout">
          <aside class="explain" id="explain" aria-live="polite"></aside>
          <div>
            <input type="search" id="q" placeholder="Buscar ticker, nombre, sector o temática" aria-label="Buscar acción" style="margin-bottom:10px;width:100%;max-width:320px">
            <div class="tbl-wrap">
              <div class="tbl-body"><table id="all" class="fixed"></table></div>
              <div class="tbl-foot"><table id="all-foot" class="fixed"></table></div>
            </div>
          </div>
        </div>
      </section>

      ${d.markets ? marketsPanel(d) : ""}
      ${d.rates ? ratesPanel(d) : ""}
    </div>
    </div>
  </div>`;
  wirePdf(d);

  wireTug();
  wireHelp();
  drawSwarm(d);
  wireBreadth(d);
  wireMarkets(d);
  drawHeatmap(d);
  window.onresize = debounce(() => { drawSwarm(d); fitTugLabels(); drawHeatmap(d); }, 150);
  allTable(d.components, usePts, usePts ? d.model_pts : d.model_ret);

  const miss = d.missing?.length ? ` Sin precio hoy: ${d.missing.map(esc).join(", ")}.` : "";
  document.getElementById("foot").innerHTML = `
    <p>Contribución = peso de la acción en el SPY × variación del día. Los pesos son los publicados por SSGA (as of ${esc(d.holdings_as_of ?? "s/d")}); los precios vienen de Yahoo Finance con demora. Los puntos se calculan sobre el cierre anterior del S&amp;P 500 (${fmt(d.spx_prev, 2, false)}).</p>
    <p>Control: la suma de contribuciones da ${fmt(d.model_ret, 3)}% contra ${fmt(d.spy_ret, 3)}% del SPY (diferencia de ${fmt(d.residual, 3)} pp, por caja, dividendos y redondeos).${miss}</p>`;
}

/* ---------- Tira de fuerzas ---------- */
function tugBar(comps, val, unit, net) {
  const N = 12;
  const pos = comps.filter(c => val(c) > 0).sort((a, b) => val(b) - val(a));
  const neg = comps.filter(c => val(c) < 0).sort((a, b) => val(a) - val(b));
  const P = pos.reduce((s, c) => s + val(c), 0);
  const Nn = -neg.reduce((s, c) => s + val(c), 0);
  const T = P + Nn || 1;
  const segs = [];
  const restNeg = neg.slice(N), restPos = pos.slice(N);
  // Izquierda: desde el borde hacia el cero (las más grandes junto al cero)
  if (restNeg.length) segs.push({ t: `Otras ${restNeg.length}`, v: restNeg.reduce((s, c) => s + val(c), 0), rest: true, cls: "neg" });
  neg.slice(0, N).reverse().forEach(c => segs.push({ t: c.t, n: c.n, r: c.r, v: val(c), cls: "neg" }));
  pos.slice(0, N).forEach(c => segs.push({ t: c.t, n: c.n, r: c.r, v: val(c), cls: "pos" }));
  if (restPos.length) segs.push({ t: `Otras ${restPos.length}`, v: restPos.reduce((s, c) => s + val(c), 0), rest: true, cls: "pos" });

  const zero = Nn / T * 100;
  const netPos = Math.min(98, Math.max(2, zero + (net / T) * 100));
  const html = segs.map(s => {
    const w = Math.abs(s.v) / T * 100;
    const label = esc(s.t);
    const desc = s.rest ? `${s.t}: ${fmt(s.v, 2)} ${unit}` : `${s.t} ${s.n ? "(" + s.n + ")" : ""}: ${fmt(s.r, 2)}%, ${fmt(s.v, 2)} ${unit}`;
    return `<div class="seg ${s.cls}${s.rest ? " rest" : ""}" style="width:${w}%" tabindex="0" data-desc="${esc(desc)}" data-label="${label}" aria-label="${esc(desc)}"></div>`;
  }).join("");

  return `<div class="tug-wrap">
    <div class="tug-sides"><span class="down">Restaron ${fmt(-Nn, 1)} ${unit}</span><span class="up">Sumaron ${fmt(P, 1)} ${unit}</span></div>
    <div class="tug" role="img" aria-label="Contribución de cada acción, negativas a la izquierda y positivas a la derecha">${html}<div class="zero" style="left:calc(${zero}% - 1px)"></div></div>
    <div class="net"><div class="net-mark" style="left:${netPos}%">Neto ${fmt(net, 1)} ${unit}</div></div>
    <p class="tug-caption muted" id="tugcap" aria-live="polite">Pasá el cursor o tocá un bloque para ver el detalle.</p>
  </div>`;
}
function fitTugLabels() {
  // Muestra el ticker solo si entra completo en el bloque
  document.querySelectorAll(".seg").forEach(el => {
    el.innerHTML = `<span>${el.dataset.label}</span>`;
    if (el.firstChild.offsetWidth > el.clientWidth - 6) el.textContent = "";
  });
}
function wireTug() {
  fitTugLabels();
  const cap = document.getElementById("tugcap");
  document.querySelectorAll(".seg").forEach(el => {
    const show = () => { cap.textContent = el.dataset.desc; cap.classList.remove("muted"); };
    el.addEventListener("mouseenter", show);
    el.addEventListener("focus", show);
    el.addEventListener("click", show);
  });
}

/* ---------- Ayuda ---------- */
function helpBtn(id, label) {
  return `<button class="help" type="button" aria-expanded="false" aria-controls="${id}" aria-label="${esc(label)}" title="${esc(label)}">?</button>`;
}
function wireHelp() {
  const opened = new Set(loadState().help || []);
  document.querySelectorAll(".help").forEach(b => {
    const id = b.getAttribute("aria-controls");
    const box = document.getElementById(id);
    if (opened.has(id)) { b.setAttribute("aria-expanded", "true"); box.hidden = false; }
    b.addEventListener("click", () => {
      const open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!open));
      box.hidden = open;
      open ? opened.delete(id) : opened.add(id);
      saveState({ help: [...opened] });
    });
  });
  const det = document.querySelector("details.all-th");
  if (det) {
    det.open = !!loadState().thAll;
    det.addEventListener("toggle", () => saveState({ thAll: det.open }));
  }
}
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

/* ---------- Campana (beeswarm) ---------- */
function drawSwarm(d) {
  const box = document.getElementById("swarm");
  if (!box) return;
  const W = Math.max(320, box.clientWidth);
  const comps = d.components.filter(c => c.r != null && c.w != null);
  if (!comps.length) { box.innerHTML = ""; return; }

  // Rango simétrico que deja afuera solo los extremos (se pegan al borde)
  const rs = comps.map(c => c.r).sort((a, b) => a - b);
  const q = p => rs[Math.min(rs.length - 1, Math.max(0, Math.round(p * (rs.length - 1))))];
  let lim = Math.max(Math.abs(q(0.01)), Math.abs(q(0.99)), Math.abs(d.spy_ret ?? 0), 0.5) * 1.1;
  const steps = [0.25, 0.5, 1, 2, 2.5, 5, 10, 20];
  const step = steps.find(s => lim / s <= 4) ?? 20;
  lim = Math.ceil(lim / step) * step;

  const padX = 12, top = 40, bottom = 30;
  const sx = r => padX + (Math.max(-lim, Math.min(lim, r)) + lim) / (2 * lim) * (W - 2 * padX);
  const wmax = Math.max(...comps.map(c => c.w));
  const rmax = W < 600 ? 15 : 24;
  const rad = w => Math.max(W < 600 ? 1.4 : 1.8, Math.sqrt(w / wmax) * rmax);

  // Colocación: primero las grandes, cada círculo en la posición vertical libre más cercana al centro
  const nodes = comps.slice().sort((a, b) => b.w - a.w).map(c => ({ c, x: sx(c.r), r: rad(c.w), y: 0 }));
  const placed = [];
  const gap = 0.6;
  for (const n of nodes) {
    const near = placed.filter(p => Math.abs(p.x - n.x) < p.r + n.r + gap);
    const cands = [0];
    for (const p of near) {
      const dx = p.x - n.x, R = p.r + n.r + gap;
      const dy = Math.sqrt(Math.max(0, R * R - dx * dx));
      cands.push(p.y + dy, p.y - dy);
    }
    cands.sort((a, b) => Math.abs(a) - Math.abs(b));
    for (const y of cands) {
      if (near.every(p => (p.x - n.x) ** 2 + (p.y - y) ** 2 >= (p.r + n.r + gap) ** 2 - 1e-6)) { n.y = y; break; }
    }
    placed.push(n);
  }
  const ext = Math.max(...placed.map(n => Math.abs(n.y) + n.r), 30);
  const H = top + 2 * ext + bottom;
  const cy = top + ext;

  const ticks = [];
  for (let v = -lim; v <= lim + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  const ew = d.breadth.equal_weight_ret, spy = d.spy_ret;
  const vline = (v, color, dash, label, anchor, width) => v == null ? "" : `
    <line x1="${sx(v)}" x2="${sx(v)}" y1="${top - 6}" y2="${H - bottom + 4}" stroke="${color}" stroke-width="${width}" ${dash ? 'stroke-dasharray="6 4"' : ""}/>
    ${label ? `<path d="M ${sx(v) - 5} ${top - 11} L ${sx(v) + 5} ${top - 11} L ${sx(v)} ${top - 4} Z" fill="${color}"/>
    <text x="${sx(v) + (anchor === "start" ? 7 : anchor === "end" ? -7 : 0)}" y="${top - 15}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="${color}">${label}</text>` : ""}`;

  // Etiquetas de las líneas: si quedan muy cerca, se separan en altura
  const close = spy != null && ew != null && Math.abs(sx(spy) - sx(ew)) < 150;

  // Solo se rotulan los círculos donde el ticker entra completo
  const fs = n => n.r > 17 ? 11 : 9;
  const labelled = new Set(nodes.filter(n => 2 * n.r - 3 >= n.c.t.length * fs(n) * 0.62).map(n => n.c.t));
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución de la variación diaria de las acciones del S&P 500, tamaño según peso">
    ${ticks.map(t => `<line x1="${sx(t)}" x2="${sx(t)}" y1="${top - 4}" y2="${H - bottom}" stroke="var(--line)" stroke-width="1"/>
      <text x="${sx(t)}" y="${H - 10}" text-anchor="middle" font-size="${t === 0 ? 13 : 12}" font-weight="${t === 0 ? 800 : 400}" fill="${t === 0 ? "var(--ink)" : "var(--muted)"}">${t === 0 ? "0%" : fmt(t, step < 1 ? 2 : 0) + "%"}</text>`).join("")}
    ${placed.map((n, i) => `<circle cx="${n.x.toFixed(1)}" cy="${(cy + n.y).toFixed(1)}" r="${n.r.toFixed(1)}"
        fill="var(${n.c.r > 0 ? "--up" : n.c.r < 0 ? "--down" : "--muted"})" fill-opacity="${n.r > 6 ? 0.85 : 0.7}"
        stroke="var(--panel)" stroke-width="0.6" tabindex="${n.r >= 6 ? 0 : -1}" data-i="${i}"/>`).join("")}
    ${placed.filter(n => labelled.has(n.c.t)).map(n => `<text x="${n.x}" y="${cy + n.y + 4}" text-anchor="middle" font-size="${fs(n)}" font-weight="700" fill="var(--on-color)" pointer-events="none">${esc(n.c.t)}</text>`).join("")}
    ${vline(0, "var(--muted)", false, "", "middle", 1.5)}
    ${vline(ew, "var(--ew)", true, `Equiponderado ${fmt(ew, 2)}%`, close ? (ew <= spy ? "end" : "start") : "middle", 2)}
    ${vline(spy, "var(--spy)", false, `SPY ${fmt(spy, 2)}%`, close ? (ew <= spy ? "start" : "end") : "middle", 3)}
  </svg>`;

  const cap = document.getElementById("swarmcap");
  const show = el => {
    const n = placed[+el.dataset.i];
    if (!n) return;
    const c = n.c;
    cap.textContent = `${c.t} (${c.n}), ${c.s}: ${fmt(c.r, 2)}% en el día, peso ${fmt(c.w, 2, false)}%, aporte ${fmt(c.p ?? c.c, 2)} ${c.p != null ? "pts" : "pp"}`;
    cap.classList.remove("muted");
  };
  box.querySelectorAll("circle").forEach(el => {
    el.addEventListener("mouseenter", () => show(el));
    el.addEventListener("focus", () => show(el));
    el.addEventListener("click", () => show(el));
  });
}

/* ---------- Contribuyentes ---------- */
function movers(comps, val, unit) {
  const pos = comps.filter(c => val(c) > 0).sort((a, b) => val(b) - val(a)).slice(0, 10);
  const neg = comps.filter(c => val(c) < 0).sort((a, b) => val(a) - val(b)).slice(0, 10);
  const max = Math.max(...[...pos, ...neg].map(c => Math.abs(val(c))), 1e-9);
  const list = (arr, color) => arr.map(c => `
    <div class="row">
      <div class="tk">${esc(c.t)}</div>
      <div><div class="nm">${esc(c.n)} <span class="${cls(c.r)}">${fmt(c.r, 2)}%</span></div>
        <div class="minibar" style="width:${Math.abs(val(c)) / max * 100}%;background:var(${color})"></div></div>
      <div class="val ${cls(val(c))}">${fmt(val(c), 2)}</div>
    </div>`).join("") || `<p class="muted">Ninguna.</p>`;
  return `<div class="movers">
    <div><h3 class="up">Sumaron (${unit})</h3>${list(pos, "--up")}</div>
    <div><h3 class="down">Restaron (${unit})</h3>${list(neg, "--down")}</div>
  </div>`;
}

/* ---------- Horario del mercado ---------- */
function nyParts(dt) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const p = Object.fromEntries(f.formatToParts(dt).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute };
}
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const mvdOf = m => { const off = nyOffsetDiff(); return hhmm(((m + off) % 1440 + 1440) % 1440); };
function nyOffsetDiff() {  // minutos entre Montevideo y Nueva York ahora
  const now = new Date();
  const g = tz => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(now).map(x => [x.type, x.value])); return +p.hour * 60 + +p.minute; };
  return ((g("America/Montevideo") - g("America/New_York")) % 1440 + 1440 + 720) % 1440 - 720;
}

function drawClock() {
  const box = document.getElementById("clock");
  const c = window.__SPY_CLOCK__;
  if (!box || !c) return;
  const now = nyParts(new Date());
  const today = c.now.slice(0, 10) === now.date ? c : null;
  const openM = today && today.open ? nyParts(new Date(today.open)).min : 570;
  const closeM = today && today.close ? nyParts(new Date(today.close)).min : 960;
  const session = !!(today && today.session);
  const S = 240, E = 1200, span = E - S;   // de 4:00 a 20:00
  const pct = m => (Math.min(E, Math.max(S, m)) - S) / span * 100;
  let state, color, extra = "";
  const m = now.min;
  if (!session) { state = "Mercado cerrado hoy"; color = "var(--muted)"; }
  else if (m < 240) { state = "Mercado cerrado: el pre-market abre a las 4:00 de Nueva York"; color = "var(--muted)"; }
  else if (m < openM) { state = "Pre-market"; color = "var(--ew)"; extra = `abre en ${dur(openM - m)}`; }
  else if (m < closeM) { state = "Mercado abierto"; color = "var(--up)"; extra = `cierra en ${dur(closeM - m)}${today.early ? " (media jornada)" : ""}`; }
  else if (m < E) { state = "After-hours"; color = "var(--ew)"; extra = `termina en ${dur(E - m)}`; }
  else { state = "Mercado cerrado"; color = "var(--muted)"; }
  const hol = (c.holidays || []).slice(0, 4);
  const soon = d => (new Date(d) - new Date(now.date)) / 864e5 <= 7;
  const ticks = [240, openM, closeM, 1200];
  box.innerHTML = `<div class="clock">
    <div class="clock-top">
      <span class="clock-state"><span class="dot" style="background:${color}"></span>${esc(state)}${extra ? ` <span class="muted" style="font-weight:500">· ${esc(extra)}</span>` : ""}</span>
      <span class="muted">Nueva York ${hhmm(m)} · Montevideo ${mvdOf(m)}</span>
    </div>
    ${session ? `<div class="hbar" role="img" aria-label="Horario: pre-market, rueda y after-hours">
      <div class="seg-pre" style="width:${pct(openM)}%">Pre-market</div>
      <div class="seg-reg" style="width:${pct(closeM) - pct(openM)}%">Rueda</div>
      <div class="seg-post" style="width:${pct(E) - pct(closeM)}%">After-hours</div>
      ${m >= S && m <= E ? `<div class="hnow" style="left:calc(${pct(m)}% - 1px)" title="Ahora"></div>` : ""}
    </div>
    <div class="hticks">${ticks.map(t => `<span style="left:${Math.min(97, Math.max(3, pct(t)))}%">${hhmm(t)} NY / ${mvdOf(t)} MVD</span>`).join("")}</div>` : ""}
    ${hol.length ? `<div class="chips">${hol.map(h => `<span class="chip${soon(h.d) ? " warn" : ""}">${esc(fechaCorta(h.d))}: ${esc(h.tipo === "cerrado" ? "cerrado (" + h.n + ")" : h.n.toLowerCase())}</span>`).join("")}</div>` : ""}
  </div>`;
  // El resumen de pre-market desaparece al abrir el mercado
  const ext = document.querySelector(".extbox[data-kind='pre']");
  if (ext && session && m >= openM) ext.remove();
}
function dur(min) { const h = Math.floor(min / 60), mm = min % 60; return h ? `${h} h ${mm} min` : `${mm} min`; }

/* ---------- PDF ---------- */
function wirePdf(d) {
  const b = document.getElementById("pdf");
  if (!b) return;
  const data = window.__SPY_PDF__;
  b.hidden = !data;
  if (!data) return;
  b.onclick = () => {
    try {
      const bin = atob(data), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      let doc = document;
      try { if (window.parent && window.parent.document) doc = window.parent.document; } catch (e) { /* mismo documento */ }
      const view = doc.defaultView || window;
      const url = view.URL.createObjectURL(new view.Blob([arr], { type: "application/pdf" }));
      const a = doc.createElement("a");
      a.href = url; a.download = window.__SPY_PDF_NAME__ || "resumen.pdf";
      doc.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => view.URL.revokeObjectURL(url), 5000);
    } catch (e) {
      b.textContent = "No se pudo descargar";
    }
  };
}

function sliceFor(dates, key) {
  if (key === "ytd") {
    const yr = dates[dates.length - 1].slice(0, 4);
    const k = dates.findIndex(dd => dd.slice(0, 4) === yr);
    return Math.max(0, k - 1);  // desde el último cierre del año anterior
  }
  return Math.max(0, dates.length - 1 - +key);
}

function wireMarkets(d) {
  const fd = iso => { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString(LOC, { day: "numeric", month: "short", year: "numeric" }); };
  if (d.markets && document.getElementById("mkt-chart")) {
    const m = d.markets;
    let key = String(loadState().mp ?? "ytd");
    const tabs = document.querySelectorAll("[data-mp]");
    const draw = () => {
      tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.mp === key)));
      const st = sliceFor(m.dates, key), dates = m.dates.slice(st);
      const series = m.rows.map((r, i) => {
        const h = (m.hist[r.n] || []).slice(st), b = h.find(v => v != null);
        return { name: r.n, vals: h.map(v => v == null || !b ? null : (v / b - 1) * 100), color: MKT_COLORS[i % MKT_COLORS.length], w: i === 0 ? 2.6 : 1.8 };
      });
      lineChart("mkt-chart", dates, series, { zero: true, h: 260, padL: 46, unit: "%",

        tip: i => `${fd(dates[i])}: ` + series.map(sr => `${sr.name} ${sr.vals[i] == null ? "s/d" : fmt(sr.vals[i], 2) + "%"}`).join(", ") });
    };
    tabs.forEach(t => t.addEventListener("click", () => { key = t.dataset.mp; saveState({ mp: key }); draw(); }));
    draw();
    window.addEventListener("resize", debounce(draw, 150));
  }
  const off = d.rates?.official;
  if (off && document.getElementById("rates-chart")) {
    let key = String(loadState().rp ?? "252");
    const tabs = document.querySelectorAll("[data-rp]");
    const names = { "1": "1 año", "2": "2 años", "5": "5 años", "10": "10 años", "30": "30 años" };
    const colors = { "1": "var(--muted)", "2": "var(--ew)", "5": "var(--c4)", "10": "var(--spy)", "30": "var(--c3)" };
    const draw = () => {
      tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.rp === key)));
      const st = sliceFor(off.dates, key), dates = off.dates.slice(st);
      const series = Object.keys(off.hist).map(k => ({ name: names[k] || k, vals: off.hist[k].slice(st), color: colors[k] || "var(--ink)", w: k === "10" ? 2.6 : 1.8 }));
      lineChart("rates-chart", dates, series, { h: 240, padL: 46, unit: "%", fmtY: v => fmt(v, 2, false) + "%", fmtLast: v => fmt(v, 2, false) + "%",
        tip: i => `${fd(dates[i])}: ` + series.map(sr => `${sr.name} ${sr.vals[i] == null ? "s/d" : fmt(sr.vals[i], 2, false) + "%"}`).join(", ") });
    };
    tabs.forEach(t => t.addEventListener("click", () => { key = t.dataset.rp; saveState({ rp: key }); draw(); }));
    draw();
    window.addEventListener("resize", debounce(draw, 150));
  }
}

/* ---------- Mapa de calor ---------- */
const HEAT_STOPS = [[-3, [246, 53, 56]], [-2, [191, 64, 69]], [-1, [139, 68, 78]], [0, [65, 69, 84]],
                    [1, [53, 118, 78]], [2, [47, 158, 79]], [3, [48, 204, 90]]];
function heatColor(v) {
  if (v == null || Number.isNaN(v)) return "rgb(65,69,84)";
  const x = Math.max(-3, Math.min(3, v));
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    const [v1, c1] = HEAT_STOPS[i - 1], [v2, c2] = HEAT_STOPS[i];
    if (x <= v2) { const t = (x - v1) / (v2 - v1); return `rgb(${c1.map((c, k) => Math.round(c + (c2[k] - c) * t)).join(",")})`; }
  }
  return "rgb(48,204,90)";
}

// Treemap "squarified": rectángulos lo más cuadrados posible
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((a, it) => a + it.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = w * h / total;
  const rest = items.map(it => ({ ...it, a: it.v * scale }));
  let row = [];
  const worst = (r, side) => {
    const sum = r.reduce((a, it) => a + it.a, 0);
    const mx = Math.max(...r.map(it => it.a)), mn = Math.min(...r.map(it => it.a));
    return Math.max(side * side * mx / (sum * sum), (sum * sum) / (side * side * mn));
  };
  const place = r => {
    const sum = r.reduce((a, it) => a + it.a, 0);
    if (w >= h) {
      const cw = sum / h; let yy = y;
      r.forEach(it => { const hh = it.a / cw; out.push({ ...it, x, y: yy, w: cw, h: hh }); yy += hh; });
      x += cw; w -= cw;
    } else {
      const rh = sum / w; let xx = x;
      r.forEach(it => { const ww = it.a / rh; out.push({ ...it, x: xx, y, w: ww, h: rh }); xx += ww; });
      y += rh; h -= rh;
    }
  };
  while (rest.length) {
    const side = Math.min(w, h), c = rest[0];
    if (!row.length || worst(row.concat([c]), side) <= worst(row, side)) { row.push(c); rest.shift(); }
    else { place(row); row = []; }
  }
  if (row.length) place(row);
  return out;
}

function drawHeatmap(d) {
  const box = document.getElementById("heatmap");
  if (!box) return;
  const W = box.clientWidth, H = box.clientHeight;
  const comps = d.components.filter(c => c.w > 0);
  const bySec = {};
  comps.forEach(c => (bySec[c.s] = bySec[c.s] || []).push(c));
  const secs = Object.entries(bySec).map(([s, cs]) => ({ s, cs, v: cs.reduce((a, c) => a + c.w, 0) }))
    .sort((a, b) => b.v - a.v);
  const unit = comps.some(c => c.p != null) ? "pts" : "pp";
  let html = "", cells = [];
  squarify(secs, 0, 0, W, H).forEach(sr => {
    const head = sr.h > 40 && sr.w > 50 ? 16 : 0;
    html += `<div class="hm-sec" style="left:${sr.x}px;top:${sr.y}px;width:${sr.w}px;height:${sr.h}px">
      ${head ? `<div class="hm-sec-name" title="${esc(sr.s)}">${esc(sr.s)}</div>` : ""}</div>`;
    const items = sr.cs.slice().sort((a, b) => b.w - a.w).map(c => ({ v: c.w, c }));
    squarify(items, sr.x + 1, sr.y + head + 1, sr.w - 2, sr.h - head - 2).forEach(r => {
      const c = r.c, i = cells.push(c) - 1;
      const fs = Math.max(8, Math.min(26, Math.sqrt(r.w * r.h) / 4.2));
      const pfs = Math.max(8, fs * 0.62);
      const showT = r.w > 26 && r.h > 14 && r.w - 8 > c.t.length * fs * 0.72;
      const showP = showT && r.h > fs * 2.3 && r.w - 8 > 6 * pfs * 0.62;
      html += `<div class="hm-cell" tabindex="${r.w * r.h > 900 ? 0 : -1}" data-i="${i}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${heatColor(c.r)};font-size:${fs}px">
        ${showT ? `<b>${esc(c.t)}</b>` : ""}${showP ? `<span style="font-size:${pfs}px">${fmt(c.r, 2)}%</span>` : ""}</div>`;
    });
  });
  box.innerHTML = html;
  const cap = document.getElementById("heatcap");
  const show = el => {
    const c = cells[+el.dataset.i];
    if (!c) return;
    cap.innerHTML = `<b>${esc(c.t)}</b> ${esc(c.n)}, ${esc(c.s)}: <span class="${cls(c.r)}">${fmt(c.r, 2)}%</span> en el día, peso ${fmt(c.w, 2, false)}%, aporte <span class="${cls(c.p ?? c.c)}">${fmt(c.p ?? c.c, 2)} ${unit}</span>.`;
    cap.classList.remove("muted");
  };
  box.querySelectorAll(".hm-cell").forEach(el => {
    el.addEventListener("mouseenter", () => show(el));
    el.addEventListener("focus", () => show(el));
    el.addEventListener("click", () => show(el));
  });
}

/* ---------- Temáticas ---------- */
function themesPanel(themes, usePts) {
  const v = t => usePts ? t.p : t.c;
  const unit = usePts ? "pts" : "pp";
  const pos = themes.filter(t => v(t) > 0).sort((a, b) => v(b) - v(a)).slice(0, 8);
  const neg = themes.filter(t => v(t) < 0).sort((a, b) => v(a) - v(b)).slice(0, 8);
  const max = Math.max(...[...pos, ...neg].map(t => Math.abs(v(t))), 1e-9);
  const row = (t, color) => `
    <div class="trow">
      <div>
        <div class="tn">${esc(t.n)}<small>${esc(t.g)}${t.agg ? ", total" : ""}</small></div>
        <div class="tm"><span class="${cls(t.r)}">${fmt(t.r, 2)}%</span>, ${t.up} de ${t.valid} en alza. Más influyentes: ${t.lead.map(l => `${esc(l.t)} <span class="${cls(l.v)}">${fmt(l.v, 1)}</span>`).join(", ")}</div>
        <div class="minibar" style="width:${Math.abs(v(t)) / max * 100}%;background:var(${color})"></div>
      </div>
      <div class="val ${cls(v(t))}">${fmt(v(t), 2)}</div>
    </div>`;
  const list = (arr, color) => arr.map(t => row(t, color)).join("") || `<p class="muted">Ninguna.</p>`;
  const all = themes.slice().sort((a, b) => v(b) - v(a));
  return `
    <div class="movers">
      <div><h3 class="up" style="font-size:15px;margin-bottom:8px">Sumaron (${unit})</h3>${list(pos, "--up")}</div>
      <div><h3 class="down" style="font-size:15px;margin-bottom:8px">Restaron (${unit})</h3>${list(neg, "--down")}</div>
    </div>
    <details class="all-th">
      <summary>Ver las ${themes.length} temáticas y sus empresas</summary>
      <div class="scroll" style="margin-top:10px"><table>
        <thead><tr><th class="l">Temática</th><th class="l">Grupo</th><th>Empresas</th><th>Peso %</th><th>Var. %</th><th>En alza</th><th>${usePts ? "Puntos" : "Aporte pp"}</th><th class="l">Integrantes (por peso)</th></tr></thead>
        <tbody>${all.map(t => `<tr>
          <td class="l"><b>${esc(t.n)}</b></td><td class="l">${esc(t.g)}</td><td>${t.k}</td><td>${fmt(t.w, 1, false)}</td>
          <td class="${cls(t.r)}">${fmt(t.r, 2)}</td><td>${t.up}/${t.valid}</td><td class="${cls(v(t))}">${fmt(v(t), 2)}</td>
          <td class="mem">${t.mem.map(esc).join(", ")}</td></tr>`).join("")}</tbody>
      </table></div>
    </details>`;
}

/* ---------- Sectores ---------- */
function sectors(secs, unit, usePts) {
  const v = s => usePts ? s.p : s.c;
  const max = Math.max(...secs.map(s => Math.abs(v(s))), 1e-9);
  return secs.map(s => {
    const w = Math.abs(v(s)) / max * 50;
    const left = v(s) >= 0 ? 50 : 50 - w;
    return `<div class="sec">
      <div><div>${esc(s.s)}</div><div class="meta">${fmt(s.r, 2)}%, ${s.up} de ${s.n} en alza</div></div>
      <div class="div-bar"><div class="axis"></div><div class="fill" style="left:${left}%;width:${w}%;background:var(${v(s) >= 0 ? "--up" : "--down"})"></div></div>
      <div class="val ${cls(v(s))}" style="text-align:right;font-weight:700">${fmt(v(s), 2)}</div>
    </div>`;
  }).join("");
}

      <div class="stat"><b class="${cls(b.rsp_ret)}">${fmt(b.rsp_ret, 2)}%</b><span>RSP, S&amp;P 500 equal weight</span></div>
      <div class="stat"><b class="${cls(spread)}">${fmt(spread, 2)} pp</b><span>SPY menos RSP: positivo es que ganaron las grandes</span></div>
